<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Spin & Win</title>
<style>
:root{--bg:#050b14;--panel:rgba(13,27,47,.86);--soft:#13243b;--text:#f7fbff;--muted:#9eb1c8;--blue:#1677ff;--cyan:#00c2ff;--line:rgba(255,255,255,.11)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 10% 5%,rgba(22,119,255,.25),transparent 28%),radial-gradient(circle at 90% 15%,rgba(0,194,255,.16),transparent 24%),linear-gradient(145deg,#040914,#07111f 58%,#08192d)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:34px 34px}.shell{width:min(1240px,94vw);margin:auto;padding:26px 0 40px;position:relative}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:13px}.logo{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 14px 35px rgba(22,119,255,.35)}h1,h2,p{margin-top:0}.brand h1{font-size:22px;margin-bottom:3px}.brand p,.status,.helper{color:var(--muted)}.pill{padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#20d39a;margin-right:8px;box-shadow:0 0 14px #20d39a}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}.glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(0,0,0,.28)}.panel{padding:20px;border-radius:26px;position:sticky;top:18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#79b3ff;margin-bottom:7px}.panel h2{font-size:26px;margin-bottom:6px}.helper{font-size:14px;line-height:1.55;margin-bottom:16px}textarea{width:100%;min-height:285px;resize:vertical;border:1px solid var(--line);border-radius:18px;padding:15px;background:rgba(3,11,22,.68);color:white;font:inherit;line-height:1.6;outline:none}textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(22,119,255,.12)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{border:0;border-radius:15px;padding:13px 15px;color:white;font-weight:800;cursor:pointer;transition:.16s}button:hover{transform:translateY(-1px)}button:disabled{opacity:.55;cursor:not-allowed}.primary{background:linear-gradient(135deg,var(--blue),#1558d5);box-shadow:0 12px 26px rgba(22,119,255,.25)}.secondary{background:rgba(255,255,255,.07);border:1px solid var(--line)}.settings{display:grid;gap:11px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.setting{display:flex;justify-content:space-between;align-items:center;font-size:14px}.toggle{appearance:none;width:44px;height:24px;border-radius:999px;background:#33465f;position:relative;cursor:pointer}.toggle:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:white;top:3px;left:3px;transition:.2s}.toggle:checked{background:var(--blue)}.toggle:checked:after{transform:translateX(20px)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.stat{padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.045)}.stat span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.stat strong{font-size:27px}.stage{min-height:760px;border-radius:30px;padding:clamp(18px,3vw,34px);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}.stage:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(22,119,255,.18),transparent 68%)}.stage-head{width:100%;position:relative;z-index:2}.stage-head h2{font-size:clamp(30px,4vw,52px);letter-spacing:-.05em;margin-bottom:6px}.wheel-wrap{width:min(650px,100%);aspect-ratio:1;position:relative;z-index:2;margin:8px auto}canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 20px 35px rgba(0,0,0,.38))}.pointer{position:absolute;left:50%;top:-5px;z-index:8;transform:translateX(-50%);width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-top:54px solid white;filter:drop-shadow(0 5px 5px rgba(0,0,0,.35))}.spin{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(108px,18vw,138px);height:clamp(108px,18vw,138px);border-radius:50%;border:8px solid white;background:linear-gradient(135deg,var(--blue),var(--cyan));font-size:clamp(20px,3vw,28px);box-shadow:0 16px 45px rgba(22,119,255,.48)}.winner{display:none;width:min(650px,100%);padding:18px 22px;text-align:center;border-radius:20px;border:1px solid rgba(32,211,154,.45);background:rgba(32,211,154,.09);position:relative;z-index:3}.winner span{color:#9feace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:900}.winner strong{display:block;font-size:clamp(34px,6vw,64px);margin-top:4px;word-break:break-word}.status{font-size:14px;margin-top:14px;position:relative;z-index:3}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:20}.confetti i{position:absolute;width:9px;height:16px;top:-30px;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translate3d(var(--x),820px,0) rotate(680deg);opacity:0}}@media(max-width:920px){.layout{grid-template-columns:1fr}.panel{position:static}.stage{min-height:auto}textarea{min-height:190px}}@media(max-width:560px){.topbar{align-items:flex-start}.pill{display:none}.buttons{grid-template-columns:1fr}.stage{padding:18px 12px}.pointer{border-left-width:18px;border-right-width:18px;border-top-width:42px}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar"><div class="brand"><div class="logo">SW</div><div><h1>Spin & Win</h1><p>Professional random winner selector</p></div></div><div class="pill"><span class="dot"></span>Ready for live draw</div></header>
<div class="layout">
<aside class="panel glass"><p class="eyebrow">Draw setup</p><h2>Participants</h2><p class="helper">Enter one name per line. Duplicate names are removed automatically.</p><textarea id="names">Ahmed
Sara
Mohammed
Fatima
Ali
Mariam</textarea><div class="buttons"><button id="update" class="primary">Update Wheel</button><button id="shuffle" class="secondary">Shuffle</button></div><div class="settings"><label class="setting"><span>Spin sound</span><input id="sound" class="toggle" type="checkbox" checked></label><label class="setting"><span>Remove winner after draw</span><input id="remove" class="toggle" type="checkbox"></label></div><div class="stats"><div class="stat"><span>Participants</span><strong id="count">0</strong></div><div class="stat"><span>Draws completed</span><strong id="draws">0</strong></div></div></aside>
<section class="stage glass"><div id="confetti" class="confetti"></div><div class="stage-head"><p class="eyebrow">Live draw</p><h2>Who will win?</h2><p class="helper">Press the centre button to begin.</p></div><div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="900" height="900"></canvas><button id="spin" class="spin">SPIN</button></div><div id="winner" class="winner"><span>Congratulations</span><strong id="winnerName"></strong></div><div id="status" class="status">Wheel ready.</div></section>
</div></main>
<script>
const c=document.getElementById('wheel'),x=c.getContext('2d'),input=document.getElementById('names'),update=document.getElementById('update'),shuffle=document.getElementById('shuffle'),spinBtn=document.getElementById('spin'),count=document.getElementById('count'),draws=document.getElementById('draws'),winner=document.getElementById('winner'),winnerName=document.getElementById('winnerName'),status=document.getElementById('status'),sound=document.getElementById('sound'),remove=document.getElementById('remove'),confetti=document.getElementById('confetti');const colors=['#1677ff','#ef476f','#06d6a0','#ffb703','#8b5cf6','#ff7a00','#00b4d8','#f72585','#43aa8b','#4361ee'];let names=[],rotation=0,spinning=false,lastTick=-1,audio=null,drawCount=0;const parse=()=>[...new Set(input.value.split(/\n|,/).map(v=>v.trim()).filter(Boolean))];function draw(){const s=c.width,m=s/2,r=m-30;x.clearRect(0,0,s,s);if(!names.length){x.beginPath();x.arc(m,m,r,0,Math.PI*2);x.fillStyle='#142640';x.fill();x.fillStyle='#9db0c7';x.font='700 38px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('Add participant names',m,m);return}const a=Math.PI*2/names.length;names.forEach((n,i)=>{const st=rotation+i*a-Math.PI/2,en=st+a;x.beginPath();x.moveTo(m,m);x.arc(m,m,r,st,en);x.closePath();x.fillStyle=colors[i%colors.length];x.fill();x.lineWidth=5;x.strokeStyle='rgba(255,255,255,.9)';x.stroke();x.save();x.translate(m,m);x.rotate(st+a/2);x.textAlign='right';x.textBaseline='middle';x.fillStyle='#fff';x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=5;const fs=Math.max(19,Math.min(35,420/Math.max(names.length,8)));x.font=`800 ${fs}px system-ui`;const max=names.length>16?12:21,label=n.length>max?n.slice(0,max-1)+'…':n;x.fillText(label,r-42,0);x.restore()});x.beginPath();x.arc(m,m,r,0,Math.PI*2);x.lineWidth=15;x.strokeStyle='rgba(255,255,255,.96)';x.stroke()}function refresh(){if(spinning)return;names=parse();count.textContent=names.length;winner.style.display='none';status.textContent=names.length>=2?'Wheel ready.':'Add at least two names.';draw()}function ac(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();return audio}function tone(f,d,v=.055,t='square'){if(!sound.checked)return;const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}const norm=a=>((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);function winnerIndex(){const a=Math.PI*2/names.length;return Math.floor((norm(-rotation)+a/2)/a)%names.length}function celebrate(){confetti.innerHTML='';for(let i=0;i<80;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=colors[i%colors.length];p.style.setProperty('--x',Math.random()*260-130+'px');p.style.animationDelay=Math.random()*.45+'s';p.style.animationDuration=1.8+Math.random()*1.2+'s';confetti.appendChild(p)}setTimeout(()=>confetti.innerHTML='',3500)}function finish(){const i=winnerIndex(),w=names[i];drawCount++;draws.textContent=drawCount;winnerName.textContent=w;winner.style.display='block';status.textContent=w+' is the winner.';[523,659,784,1047].forEach((f,j)=>setTimeout(()=>tone(f,.34,.12,'sine'),j*140));celebrate();spinning=false;spinBtn.disabled=false;if(remove.checked&&names.length>2){names.splice(i,1);input.value=names.join('\n');count.textContent=names.length;setTimeout(draw,950)}}function spin(){if(spinning||names.length<2){status.textContent='Add at least two names before spinning.';return}spinning=true;spinBtn.disabled=true;winner.style.display='none';status.textContent='Spinning…';lastTick=-1;if(sound.checked){const a=ac();if(a.state==='suspended')a.resume()}const start=rotation,target=start+(8+Math.random()*5)*Math.PI*2+Math.random()*Math.PI*2,duration=5600,t0=performance.now();function animate(now){const p=Math.min((now-t0)/duration,1),e=1-Math.pow(1-p,4);rotation=start+(target-start)*e;draw();const a=Math.PI*2/names.length,t=Math.floor(norm(rotation)/a);if(t!==lastTick){tone(480+(1-p)*320,.04);lastTick=t}if(p<1)requestAnimationFrame(animate);else{rotation=norm(rotation);draw();finish()}}requestAnimationFrame(animate)}update.addEventListener('click',refresh);shuffle.addEventListener('click',()=>{if(spinning)return;const a=parse();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}input.value=a.join('\n');refresh()});spinBtn.addEventListener('click',spin);refresh();
</script>
</body>
</html>
